name: Release do pacote

on:
  push:
    branches: [dev]
    paths: [release]

permissions:
  contents: write

concurrency:
  group: sitemath-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validar gatilho e versão
        id: release
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          TRIGGER="$(node .agents/scenarios/release/scripts/release-workflow.js detect "$BEFORE" "$AFTER")"
          echo "$TRIGGER"
          echo "$TRIGGER" | grep -q '"triggered":true'
          test -f release
          VERSION="$(echo "$TRIGGER" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          test -n "$VERSION"
          test "$VERSION" = "$(tr -d '\r\n' < release)"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm run validate:package
      - name: Empacotar distribuição validada
        id: pack
        shell: bash
        run: |
          mkdir -p .tmp/release
          TARBALL="$(npm pack --pack-destination .tmp/release)"
          echo "path=.tmp/release/$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Publicar no NPM
        run: npm publish "${{ steps.pack.outputs.path }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Criar GitHub Release após NPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.release.outputs.version }}" "${{ steps.pack.outputs.path }}#Pacote NPM" --target "$GITHUB_SHA" --title "v${{ steps.release.outputs.version }}" --generate-notes
      - name: Finalizar gatilho e convergir a primária
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .agents/scenarios/release/scripts/release-workflow.js finalize "${{ steps.release.outputs.version }}" release
          git push origin HEAD:dev
          git fetch origin main
          git checkout main
          git merge --ff-only origin/dev
          git push origin main
